spring.application.name=order-proxy
server.port=8080

rest-client.base-url=http://localhost:8081/orders
rest-client.partners-base-url=http://localhost:8081/partners
rest-client.connect-timeout=3000
rest-client.read-timeout=3000
rest-client.max-attempts=3
rest-client.backoff-delay=1000

tracking.outbox.topic=order.link.changed

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=order-proxy
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

spring.autoconfigure.exclude=io.github.resilience4j.springboot3.verifier.autoconfigure.SpringBoot3VerifierAutoConfiguration

# ========== Circuit Breaker ==========
resilience4j.circuitbreaker.instances.orderService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.orderService.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.orderService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.orderService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.orderService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.orderService.record-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.instances.orderService.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.ratelimiter.RequestNotPermitted

# ========== Rate Limiter ==========
resilience4j.ratelimiter.instances.orderService.limit-for-period=20
resilience4j.ratelimiter.instances.orderService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.orderService.timeout-duration=0s

# ========== Retry ==========
resilience4j.retry.instances.orderService.max-attempts=3
resilience4j.retry.instances.orderService.wait-duration=1s
resilience4j.retry.instances.orderService.enable-exponential-backoff=true
resilience4j.retry.instances.orderService.exponential-backoff-multiplier=2
resilience4j.retry.instances.orderService.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.orderService.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.ratelimiter.RequestNotPermitted